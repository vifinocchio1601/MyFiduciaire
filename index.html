<title>MyFiduciaire</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout : registre comptable — bandeau d'état en haut, feuilles rayées, barre d'action + onglets fixés en bas */
:root{
  --bg:#E9EFEB; --paper:#F7FAF8; --line:#CFDDD4; --ink:#16232C; --muted:#5A6B66;
  --accent:#1D6A4D; --accent-ink:#FFFFFF; --red:#B3362C; --amber:#A86A12; --ok:#2F7D4A;
  --rule:rgba(29,106,77,.10); --shadow:0 1px 2px rgba(22,35,44,.08);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1714; --paper:#16211C; --line:#2A3A33; --ink:#E3ECE7; --muted:#93A69E;
  --accent:#4DB487; --accent-ink:#0B1410; --red:#E8695E; --amber:#E2A84B; --ok:#62C08A;
  --rule:rgba(77,180,135,.10); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1714; --paper:#16211C; --line:#2A3A33; --ink:#E3ECE7; --muted:#93A69E;
  --accent:#4DB487; --accent-ink:#0B1410; --red:#E8695E; --amber:#E2A84B; --ok:#62C08A;
  --rule:rgba(77,180,135,.10); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.top .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.date{font-family:var(--f-mono);font-size:12px;opacity:.9;text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
.sec{display:flex;flex-direction:column;gap:8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:700}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.p-red{color:var(--red)}.p-amber{color:var(--amber)}.p-ok{color:var(--ok)}.p-mut{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;font-weight:600}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.dan{color:var(--red);border-color:var(--red);background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.log{font-size:13px;display:flex;flex-direction:column;gap:4px}
.log div{padding-left:10px;border-left:2px solid var(--line)}
.log .d{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-right:6px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.endday{display:flex;gap:10px;align-items:center;padding:8px 6px 6px}
.endday .hrs{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.endday .hrs b{color:var(--ink);font-family:var(--f-mono)}
.nav{display:grid;grid-template-columns:repeat(5,1fr)}
.price{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.price button{padding:6px 2px;font-size:12px}
.price button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid.b{grid-template-columns:1fr 9em}
.ln{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.gb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gb button{padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;min-width:0}
.gb button b{font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--accent)}
.gb button.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.gb button.sel b{color:var(--accent-ink)}
.gb button.bad{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.nav button{border:0;background:transparent;border-radius:0;padding:8px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);position:relative;border-top:2px solid transparent}
.nav button.on{color:var(--accent);border-top-color:var(--accent)}
.nav .bdg{position:absolute;top:3px;left:calc(50% + 14px);background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;font-family:var(--f-mono)}
/* pièce comptable */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,18,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:12px 12px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet>*{flex-shrink:0}
.opts.one{grid-template-columns:1fr}
.gb.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.gb.four{grid-template-columns:repeat(2,1fr)}}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:st}
.steps .on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opts button.bad{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opts button:disabled{opacity:1}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cal .hd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.cal button{padding:6px 2px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;min-width:0}
.cal button.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal button.selday{background:var(--accent);color:var(--accent-ink)}
.cal button.out{visibility:hidden}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .dots i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cal .dots i.l{background:var(--red)}.cal .dots i.s{background:var(--amber)}
.cal button.selday .dots i{background:var(--accent-ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;padding:8px 12px}
.moi{background:transparent;color:var(--accent-ink);border:1px solid currentColor;border-radius:999px;padding:4px 12px;font-size:13px;opacity:.9}
.moi.on{background:var(--accent-ink);color:var(--accent);opacity:1}
.right{display:flex;align-items:center;gap:10px;min-width:0}
.seg button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--accent)}
.chart .zr{stroke:var(--red);stroke-width:1;stroke-dasharray:3 3}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.inv{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px;font-family:var(--f-mono);font-size:13px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 23px,var(--rule) 23px 24px);display:flex;flex-direction:column;gap:6px}
.inv .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.inv .ttl{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.03em}
.inv .amt{font-size:18px;text-align:right}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{text-align:left;font-weight:500;font-size:13px;min-width:0}
.opts button .mono{display:block;font-weight:500;color:var(--accent)}
.opts button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rates button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.verdict{font-weight:700}
.ecr td{font-family:var(--f-mono);font-size:12px}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wk button{padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.wk button small{font-weight:500;font-size:10px;color:var(--muted)}
.wk .C{border-style:dashed;color:var(--muted)}
.wk .M,.wk .A{border-color:var(--amber)}
.grid{display:grid;grid-template-columns:auto 1fr 9em;gap:6px 8px;align-items:center}
.grid .k{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.grid input{font:inherit;font-family:var(--f-mono);text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
.grid input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
/* Ordinateur : menu latéral, contenu sur plusieurs colonnes, fenêtres centrées */
@media (min-width:960px){
 body{padding-left:232px}
 .top{padding-left:32px;padding-right:32px;padding-block:14px 16px}
 .top .row1,.top .stats{max-width:1180px}
 .stats{grid-template-columns:repeat(3,minmax(0,220px));gap:24px}
 .top .brand{display:none}
 .top .row1{justify-content:flex-end}
 main{max-width:1180px;margin:0;padding-left:32px;padding-right:32px;padding-block:24px 48px;gap:22px}
 .foot{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0;padding-bottom:env(safe-area-inset-bottom,0px)}
 .foot::before{content:"MyFiduciaire";display:block;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--accent);padding:20px 22px 14px}
 .nav{order:1;display:flex;flex-direction:column}
 .nav button{text-align:left;font-size:15px;padding:12px 22px;border-top:0;border-left:3px solid transparent}
 .nav button.on{border-left-color:var(--accent);border-top-color:transparent;background:var(--bg)}
 .nav button:hover{color:var(--ink);background:var(--bg)}
 .nav .bdg{position:static;margin-left:8px;vertical-align:1px}
 .endday{order:2;margin-top:auto;flex-direction:column;align-items:stretch;padding:16px 18px 20px;border-top:1px solid var(--line);gap:8px}
 .endday button{padding:12px}
 .sec:has(> .card ~ .card ~ .card){display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
 .sec:has(> .card ~ .card ~ .card) > :not(.card){grid-column:1/-1}
 .sec > .card:has(.cal),.sec > .card:has(table){grid-column:1/-1}
 .sec:has(> .card.chart){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
 .sec:has(> .card.chart) > :not(.card){grid-column:1/-1}
 .seg{max-width:720px}
 .seg button{flex:0 1 auto}
 .modal{align-items:center;padding:24px}
 .sheet{max-width:680px;max-height:88vh;border-radius:12px;padding:22px 26px}
 button:hover:not(:disabled){border-color:var(--accent)}
 .cal button{min-height:72px}
 .kbd{display:inline-block}
}
.kbd{display:none;font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}
</style>
</head><body>

<div class="top">
  <div class="row1"><div class="brand" id="brandName">MyFiduciaire</div><div class="right"><div class="date" id="topDate"></div><button class="moi" id="moiBtn" data-act="tab" data-v="moi">Moi</button></div></div>

</div>

 if(d.type==='paie'){const op=sum('op'),pp0=sum('p'),x=sum('x'),onss=op*.1307,pp=Math.max(0,(op+pp0-onss)*.22);
  return [['Rémunération soumise à l\'ONSS',op],['Cotisations ONSS du travailleur (13,07 %)',-onss],['Précompte professionnel (estimé)',-pp],['Avantages en nature (non versés)',pp0],['Éléments exonérés',x],['Net à payer',op-onss-pp+x]]}
 const A=sum('A')+sum('St')+sum('Cr')+sum('Li'),res=sum('Pr')-sum('Ch'),P=sum('CP')+sum('De')+res;
 return [['Total de l\'actif',A],['Capitaux propres',sum('CP')],['Dettes',sum('De')],["Résultat de l'exercice",res],['Total du passif (résultat compris)',P]];
}

function validateForm(){
 const d=M.d,sp=M.sp;if(!S.dossiers.includes(d))return;
 if(d.type==='mis'){if(!M.forme||M.order.length<CREA.length)return;const bad=(M.forme==='SRL'?0:1)+M.order.filter((x,i)=>x!==i).length;
  d.errs=Math.min(3,bad);d.done=d.h;S.myH-=sp.cost;M.res={bad};complete(d,3,true);save();renderForm();renderTop();return}
 if(['ipp','isoc','clo','bil','cab','paie'].includes(d.type)){if(!M.cls.every(Boolean))return;const bad=d.q.items.filter((it,i)=>M.cls[i]!==it.cat).length;if(!bad&&(d.type==='ipp'||d.type==='isoc'))S.st.taxOk++;if(!bad&&(d.type==='clo'||d.type==='bil'))S.st.bilOk++;
  d.errs=Math.min(3,bad);d.done=d.h;S.myH-=sp.cost;M.res={};complete(d,3,true);save();renderForm();renderTop();return}
 if(d.type==='tva'){if(!M.cls.every(Boolean))return;const bad=d.q.lines.filter((l,i)=>M.cls[i]!==lineGrid(l)).length;const mis=d.q.lines.reduce((a,l)=>a+(l.mis||0),0);if(!bad&&!mis)S.st.tvaOk++;
  d.errs=Math.min(3,bad+mis);d.done=d.h;S.myH-=sp.cost;M.res={};complete(d,3,true);save();renderForm();renderTop();return}
 const g=sp.exp,vals={};
 for(const [k] of sp.fields){const el=document.getElementById('g'+k),t=(el?el.value:'').replace(/[\s€]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');vals[k]=parseFloat(t)||0}
 const bad=sp.fields.filter(([k])=>Math.abs(vals[k]-g[k])>1).length;if(!bad)S.st.bilOk++;
 d.errs=Math.min(3,bad);d.done=d.h;S.myH-=sp.cost;M.res={vals};
 complete(d,3,true);save();renderForm();renderTop();
}

 const row=(l,v,neg)=>`<tr><td>${l}</td><td class="n ${neg&&v?'p-red':''}">${neg&&v?'− ':''}${eur(v)}</td></tr>`;
 let h=`<div class="sec"><h2>Prévision fin de mois</h2><div class="card scroll"><table>
 ${row('Honoraires clients (HTVA)',fees)}${S.mMis?row('Missions livrées ce mois (HTVA)',S.mMis):''}${row('Salaires bruts',sal,1)}${row('Charges patronales (27 %)',onss,1)}${row('Loyer',loyer,1)}${row('Logiciel comptable',soft,1)}${row('Frais de structure',st,1)}${row('Rémunération du dirigeant',S.me.sal,1)}
 <tr><th>Résultat estimé</th><th class="n ${net<0?'p-red':'p-ok'}">${eur(net)}</th></tr></table></div></div>`;
 const solde=S.tvaDue-S.tvaDed,isoc=S.qNet>0?.2*Math.min(S.qNet,25000)+.25*Math.max(0,S.qNet-25000):0;
 h+=`<div class="sec"><h3>Trimestre en cours</h3><div class="card scroll"><table>
 <tr><td>TVA facturée (due)</td><td class="n">${eur(S.tvaDue)}</td></tr><tr><td>TVA déductible</td><td class="n">${eur(S.tvaDed)}</td></tr>
 <tr><td>Solde TVA ${solde>=0?'à verser':'à récupérer'}</td><td class="n">${eur(Math.abs(solde))}</td></tr>
 <tr><td>Résultat des mois clôturés</td><td class="n ${S.qNet<0?'p-red':''}">${eur(S.qNet)}</td></tr>
 <tr><td>Impôt des sociétés estimé (20 % puis 25 %)</td><td class="n">${eur(isoc)}</td></tr></table></div>
 <div class="sub">À chaque fin de trimestre : impôt prélevé et déclaration TVA du bureau à remplir.</div></div>`;
 if(S.quarters.length)h+=`<div class="sec"><h3>Clôtures trimestrielles</h3><div class="card scroll"><table><tr><th>Trimestre</th><th class="n">Résultat</th><th class="n">Impôt</th></tr>${S.quarters.map(q=>`<tr><td>${q.q}</td><td class="n ${q.res<0?'p-red':''}">${eur(q.res)}</td><td class="n">${eur(q.isoc)}</td></tr>`).join('')}</table></div></div>`;
 return h;
}
function secHist(){
 let h='';
 h+=`<div class="sec"><h2>Historique mensuel</h2>${S.months.length?`<div class="card scroll"><table><tr><th>Mois</th><th class="n">Honoraires</th><th class="n">Charges</th><th class="n">Résultat</th></tr>${S.months.map(m=>`<tr><td style="text-transform:capitalize">${m.m}</td><td class="n">${eur(m.fees)}</td><td class="n">${eur(m.fees-m.net)}</td><td class="n ${m.net<0?'p-red':''}">${eur(m.net)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Le premier mois n\'est pas encore clôturé.</div>'}</div>`;
 return h;
}
function secSettings(){
 let h='';
 h+=`<div class="sec"><h3>Réglages</h3><div class="card"><div class="sub">Sauvegarde automatique sur cet appareil.</div>${S.noSum?'<button data-act="sumon">Réafficher le résumé de la journée</button>':''}<button class="dan" data-act="reset">Recommencer une partie</button></div></div>`;
 return h;
}
function secExam(){const ex=S.me.ex;
 return `<div class="sec"><h2>Examens ITAA</h2><div class="sub">8 questions, réussite à 6. Chaque tentative coûte 750 € au cabinet et 4 h de votre journée.</div>${['ec','cf'].map(k=>{const [n,d]=EXN[k],wait=ex.next[k]&&S.day<ex.next[k],lock=k==='cf'&&!ex.ec;
 return `<div class="card"><div class="rowx"><span class="name">${n}</span>${ex[k]?'<span class="pill p-ok">Obtenu</span>':'<span class="pill p-mut">Pas encore</span>'}</div><div class="sub">${d}</div>
 ${ex[k]?'':wait?`<div class="sub">Nouvel essai possible le ${fshort(ex.next[k])}.</div>`:lock?'<div class="sub">Obtenez d\'abord le titre d\'expert-comptable.</div>':`<button class="pri" data-act="exam" data-v="${k}" ${S.myH<4||S.cash<750?'disabled':''}>Passer l'examen</button>`}</div>`}).join('')}</div>`}
function secProfile(){
 const me=S.me,next=1500*(me.flvl+1);
 let h=`<div class="sec"><h2>Mon profil de directeur</h2><div class="card">${me.ex&&(me.ex.ec||me.ex.cf)?`<div class="rowx"><span>Titres</span><b>${[me.ex.ec?'Expert-comptable':'',me.ex.cf?'Conseiller fiscal certifié':''].filter(Boolean).join(' · ')}</b></div>`:''}<div class="rowx"><span>Compte personnel</span><b class="mono">${eur(me.perso)}</b></div>
 <div class="rowx"><span>Portefeuille d'actions</span><b class="mono">${eur(me.inv)}</b></div><div class="rowx"><span>Prêt au bureau (compte courant)</span><b class="mono">${eur(me.loan)}</b></div>
 <div class="rowx"><span>Heures par jour</span><b class="mono">${(8+.5*me.flvl+.25*S.eq.ecran).toString().replace('.',',')} h</b></div></div></div>`;
 h+=`<div class="sec"><h3>Ma rémunération</h3><div class="card"><div class="sub">Payée par le bureau en fin de mois. Vous touchez environ 60 % en net après cotisations sociales et précompte.</div>
 <div class="price">${DSAL.slice(1).map(v=>`<button class="${me.sal===v?'sel':''}" data-act="dsal" data-v="${v}">${(v/1000).toString().replace('.',',')} k€</button>`).join('')}</div>
 <button class="${me.sal===0?'pri':''}" data-act="dsal" data-v="0">Pas de rémunération</button></div></div>`;
 h+=`<div class="sec"><h3>Placement</h3><div class="card"><div class="sub">Rapporte entre 2 et 7 % par an, versé chaque mois.</div>
 <div class="btns"><button data-act="invest" data-v="1000" ${me.perso<1000?'disabled':''}>Placer 1 000 €</button><button data-act="invest" data-v="5000" ${me.perso<5000?'disabled':''}>Placer 5 000 €</button><button data-act="invest" data-v="0" ${me.inv?'':'disabled'}>Tout revendre</button></div></div></div>`;
 h+=`<div class="sec"><h3>Le bureau</h3><div class="card"><div class="btns"><button data-act="lend" ${me.perso<5000?'disabled':''}>Prêter 5 000 €</button><button data-act="repay" ${me.loan&&S.cash>=Math.min(me.loan,5000)?'':'disabled'}>Me faire rembourser</button><button data-act="apport" ${me.perso<5000?'disabled':''}>Apport de 5 000 €</button></div>
 <div class="sub">Un prêt vous sera remboursé ; un apport reste dans le bureau.</div></div></div>`;
 h+=`<div class="sec"><h3>Ma formation</h3><div class="card"><div class="rowx"><span>Niveau ${me.flvl} / 5</span><span class="sub">+0,5 h par jour à chaque niveau</span></div>
 ${me.flvl<5?`<button class="pri" data-act="dtrain" ${me.perso<next?'disabled':''}>Suivre le niveau ${me.flvl+1} (${eur(next)})</button>`:'<div class="sub">Formation complète.</div>'}</div></div>`;
 return h;
}
function secTro(){
 let h='';
 h+=`<div class="sec"><h2>Trophées (${S.tro.length} / ${TRO.length})</h3><div class="card">${TRO.map(([id,n,d,,r])=>`<div class="rowx"><span><b>${n}</b><br><span class="sub">${d} · prime ${eur(r)}</span></span>${S.tro.includes(id)?'<span class="pill p-ok">Obtenu</span>':'<span class="pill p-mut">À faire</span>'}</div>`).join('')}</div></div>`;
 return h;
}
function secShop(){
 const me=S.me;let h='';
 h+=`<div class="sec"><h2>Achats personnels</h2>${ITEMS.map((it,i)=>`<div class="card"><div class="rowx"><span class="name">${it.n}</span>${me.owned.includes(i)?'<span class="pill p-ok">Acheté</span>':`<button data-act="buy" data-v="${i}" ${me.perso<it.p?'disabled':''}>${eur(it.p)}</button>`}</div></div>`).join('')}</div>`;
 return h;
}
const SUBS={clients:[['cli','Clients'],['renta','Rentabilité'],['pros','Prospects']],cabinet:[['equipe','Équipe'],['recrut','Recrutement'],['bureaux','Bureaux'],['equip','Équipement'],['svc','Services']],
 fin:[['mois','Ce mois'],['fact','Factures'],['graph','Graphiques'],['hist','Historique']],moi:[['profil','Profil'],['exam','Examens'],['car','Carrière'],['tro','Trophées'],['shop','Achats'],['regl','Réglages']]};
let sub={clients:'cli',cabinet:'equipe',fin:'mois',moi:'profil'};
function segBar(t){const cnt={pros:S.prospects.length};return `<div class="seg" role="tablist">${SUBS[t].map(([k,l])=>`<button role="tab" class="${sub[t]===k?'sel':''}" data-act="sub" data-v="${t}:${k}">${l}${cnt[k]?` (${cnt[k]})`:''}</button>`).join('')}</div>`}
function secRdv(){if(!S.rdv.length)return '';
 return `<div class="sec"><h3>Rendez-vous demandés</h3>${S.rdv.map(r=>{const c=client(r.cid);return `<div class="card"><div class="rowx"><span class="name">${esc(c?c.name:'')}</span><span class="pill p-amber">Avant le ${fshort(r.exp)}</span></div>
 <div class="sub">A une question à vous poser · 30 minutes · conseil facturé si votre réponse est juste</div><button class="pri" data-act="rdv" data-v="${r.id}" ${S.myH<.5?'disabled':''}>Recevoir le client</button></div>`}).join('')}</div>`}
function secCareer(short){const K=S.career;
 if(!K)return short?'':`<div class="sec"><h2>Mode carrière</h2><div class="card"><div class="sub">${CH.length} chapitres avec des objectifs et un délai, et une prime à chaque chapitre réussi. Vous pouvez l'activer sur cette partie.</div><button class="pri" data-act="career">Activer le mode carrière</button></div></div>`;
 if(K.done&&short)return '';
 const c=CH[K.ch];let h='';
 if(c){const left=K.start+chDays(c)-S.day;h+=`<div class="sec"><h3>Carrière · chapitre ${K.ch+1} / ${CH.length}</h3><div class="card"><div class="rowx"><span class="name">${c.t}</span><span class="pill ${left<0?'p-red':left<60?'p-amber':'p-mut'}">${left<0?'Délai dépassé':`Encore ${Math.max(1,Math.round(left/21.7))} mois`}</span></div><div class="sub">${c.d} Prime : ${eur(c.r)}.</div>
 ${c.g.map(([l,f,t,money])=>{const v=f(),pc=Math.max(0,Math.min(100,v/t*100));return `<div class="rowx"><span>${l}</span><span class="mono ${v>=t?'p-ok':''}">${money?eur(v):Math.round(v)} / ${money?eur(t):t}</span></div><div class="bar"><i style="width:${pc}%"></i></div>`}).join('')}</div></div>`}
 if(!short)h+=`<div class="sec"><h3>Chapitres</h3><div class="card">${CH.map((x,i)=>`<div class="rowx"><span>${i+1}. ${x.t}</span>${i<K.ch?`<span class="pill ${K.stars[i]?'p-ok':'p-amber'}">${K.stars[i]?'Réussi dans les temps':'Réussi en retard'}</span>`:i===K.ch&&!K.done?'<span class="pill p-mut">En cours</span>':'<span class="pill p-mut">À venir</span>'}</div>`).join('')}</div></div>`;
 return h;
}
function secInv(){
 const L=[...S.inv].sort((a,b)=>a.due-b.due),tot=L.reduce((a,v)=>a+v.ttc,0),late=L.filter(v=>S.day>v.due),lt=late.reduce((a,v)=>a+v.ttc,0);
 const st=v=>S.day<=v.due?`<span class="pill p-mut">Échéance ${fshort(v.due)}</span>`:v.rel===2?`<span class="pill p-red">Mise en demeure · ${S.day-v.due} j</span>`:v.rel===1?`<span class="pill p-amber">Relancée · ${S.day-v.due} j de retard</span>`:`<span class="pill p-red">${S.day-v.due} j de retard</span>`;
 let h=`<div class="sec"><h2>Factures à encaisser</h2><div class="card"><div class="rowx"><span>Total à encaisser (TVAC)</span><b class="mono">${eur(tot)}</b></div><div class="rowx"><span>Dont en retard</span><b class="mono ${lt?'p-red':''}">${eur(lt)} · ${late.length} facture${late.length>1?'s':''}</b></div>
 <div class="sub">Vos honoraires sont facturés en fin de mois, payables à 30 jours. Un rappel double les chances de paiement, une mise en demeure (15 €, client un peu froissé) les triple. Après deux mois de retard et une mise en demeure, vous pouvez passer la facture en perte.</div>
 ${late.some(v=>v.rel===0)?'<button class="pri" data-act="relall">Envoyer un rappel à tous les retards</button>':''}</div>`;
 h+=L.length?L.map(v=>{const c=client(v.cid);return `<div class="card"><div class="rowx"><span class="name">${esc(v.cn)}</span>${st(v)}</div><div class="rowx"><span class="sub">${v.no} · émise le ${fshort(v.day)}${c?` · payeur ${c.pay}`:' · ancien client'}</span><b class="mono">${eur2(v.ttc)}</b></div>
 ${S.day>v.due?`<div class="btns">${v.rel===0?`<button data-act="relance" data-v="${v.id}">Envoyer un rappel</button>`:''}${v.rel===1?`<button data-act="demeure" data-v="${v.id}" ${S.day-v.rd<10?'disabled':''}>Mise en demeure (15 €)</button>${S.day-v.rd<10?`<span class="sub">possible le ${fshort(v.rd+10)}</span>`:''}`:''}${v.rel===2&&S.day-v.due>=44?`<button class="dan" data-act="perte" data-v="${v.id}">Passer en perte</button>`:''}</div>`:''}</div>`}).join(''):'<div class="empty">Aucune facture en attente de paiement.</div>';
 return h+'</div>';
}
function secRenta(){
 const ch=costH(),rows=S.clients.map(c=>{const r=rollH(c);return {c,h:r.h,f:r.f,eh:r.h>0&&r.f>0?r.f/r.h:null}}).sort((a,b)=>(a.eh??1e9)-(b.eh??1e9));
 const v=e=>e===null?'<span class="pill p-mut">Pas encore de données</span>':e>=ch*1.5?'<span class="pill p-ok">Très rentable</span>':e>=ch?'<span class="pill p-ok">Rentable</span>':e>=ch*.7?'<span class="pill p-amber">Juste</span>':'<span class="pill p-red">À perte</span>';
 return `<div class="sec"><h2>Rentabilité par client</h2><div class="sub">Sur les 12 derniers mois : heures passées sur ses dossiers et honoraires facturés. Coût moyen d'une heure de travail au cabinet : ${eur(ch)}.</div>
 ${rows.map(r=>`<div class="card"><div class="rowx"><span class="name">${esc(r.c.name)}</span>${v(r.eh)}</div>
 <div class="rowx"><span class="sub">${r.h.toFixed(1).replace('.',',')} h · ${eur(r.f)} facturés</span><b class="mono">${r.eh===null?'—':eur(r.eh)+' / h'}</b></div>
 <div class="btns"><button data-act="cprice" data-v="${r.c.id}:1.05">Augmenter de 5 %</button><button class="dan" data-act="endc" data-v="${r.c.id}">Se séparer</button></div></div>`).join('')||'<div class="empty">Aucun client.</div>'}</div>`;
}
function vAccueil(){
 const fees=S.clients.reduce((a,c)=>a+feeOf(c),0);
 let h=`<div class="sec"><h2>${esc(PAL[S.pal].n)}</h2><div class="card"><div class="rowx"><span>Honoraires mensuels</span><b class="mono">${eur(fees)} HTVA</b></div>
 <div class="rowx"><span>Équipe</span><b class="mono">${S.staff.length} / ${maxS()}</b></div><div class="rowx"><span>Mes heures aujourd'hui</span><b class="mono">${S.myH.toFixed(2).replace('.',',')} h</b></div></div></div>`;
 h=secCareer(true)+h;h+=secRdv();h+=secTodo();h+=secPros();h+=secJournal(8);return h;
}
function vClientsTab(){return segBar('clients')+(sub.clients==='pros'?secPros():sub.clients==='renta'?secRenta():secClients())}
function vCabinet(){const k=sub.cabinet;return segBar('cabinet')+(k==='recrut'?secCands():k==='bureaux'?secPal()+secOffs():k==='equip'?secEquip():k==='svc'?secSvc():secTeam())}
function vFinTab(){const k=sub.fin;return segBar('fin')+(k==='fact'?secInv():k==='graph'?vCharts():k==='hist'?secHist():secMonth())}
function vMoiTab(){const k=sub.moi;return segBar('moi')+(k==='exam'?secExam():k==='car'?secCareer(false):k==='tro'?secTro():k==='shop'?secShop():k==='regl'?secSettings():secProfile())}
function render(){
 checkTro();checkCareer();renderTop();
 if(tab==='bureau')tab='accueil';if(tab==='equipe'){tab='cabinet'}
 const un=S.dossiers.filter(d=>d.who===null||d.late).length;
 const tabs=[['accueil','Accueil',S.prospects.length+S.rdv.length],['dossiers','Dossiers',un],['clients','Clients',0],['cabinet','Cabinet',0],['fin','Finances',0]];
 document.getElementById('nav').innerHTML=tabs.map(([k,l,b])=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}">${l}${b?`<span class="bdg">${b}</span>`:''}</button>`).join('');
 const mb=document.getElementById('moiBtn');if(mb)mb.className='moi'+(tab==='moi'?' on':'');
 if(S.career&&S.career.showEnd&&document.getElementById('modal').hidden)setTimeout(showEnd,0);
 document.getElementById('app').innerHTML={accueil:vAccueil,dossiers:vDossiers,clients:vClientsTab,cabinet:vCabinet,fin:vFinTab,moi:vMoiTab}[tab]();
}
if(!load()){newGame();save()}
render();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body></html>
