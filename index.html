@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

 S.months.unshift({m:monthName(day),fees:fees+mis,sal,onss,loyer,soft,struct,dir,net,cash:Math.round(S.cash),cli:S.clients.length});S.months=S.months.slice(0,24);

 else if(ratio<.97)S.rep=clamp(S.rep+(1-ratio)*5,0,100);

function quarterEnd(day){
 const d=dateOf(day),lab=`T${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}`,b=S.qNet;
 const isoc=b>0?Math.round(.2*Math.min(b,25000)+.25*Math.max(0,b-25000)):0;
 S.cash-=isoc;S.quarters.unshift({q:lab,res:b,isoc});S.quarters=S.quarters.slice(0,12);
 log(`Clôture du ${lab} : résultat ${eur(b)}, impôt des sociétés ${eur(isoc)}.`);

function endDay(){
 const before={cash:S.cash,rep:S.rep,seq:S.logSeq||0,day:S.day};S.dayDone=0;
 for(const s of S.staff){
  const sh=s.wk[dateOf(S.day).getDay()-1]||'J',base=SHIFT[sh].h;let hrs=base*SPEED[s.lvl]*(1+.08*S.eq.scan);s.xp+=base;
  if(sh==='C')s.cg-=1;else if(sh!=='J')s.cg-=.5;
  const list=S.dossiers.filter(d=>d.who===s.id).sort((a,b)=>a.dl-b.dl);
  for(const d of list){if(hrs<=0)break;const need=d.h-d.done,use=Math.min(need,hrs);d.done+=use;hrs-=use;if(d.done>=d.h-1e-9)complete(d,s.lvl,false)}
  const up=s.lvl===1&&s.xp>=700?2:s.lvl===2&&s.xp>=1800?3:0;
  if(up){s.lvl=up;const r=ROLE[up];s.sal=Math.max(s.sal,Math.round((r.sal[0]+r.sal[1])/20)*10);log(`${s.name} devient ${r.t} (salaire ${eur(s.sal)} brut).`)}
 }
 const prev=S.day;S.day++;S.myH=8+.5*S.me.flvl+.25*S.eq.ecran;
 const m0=dateOf(prev).getMonth(),m1=dateOf(S.day).getMonth();
 if(m0!==m1){
  monthEnd(prev);
  if(m1%3===0)quarterEnd(prev);
  if(m1===0)for(const s of S.staff){if(s.cg>0){const pc=Math.round(s.sal/21.67*s.cg);S.cash-=pc;log(`${s.name} n'a pas pris ${s.cg} jour${s.cg>1?'s':''} de congé : ${eur(pc)} payés.`)}s.cg=20}
  for(const c of S.clients){
   addDossier(c,'enc');
   if(c.tva&&m1%3===0)addDossier(c,'tva');
   if(m1===2&&c.forme!=='Indépendant')addDossier(c,'bil');
   if(m1===4&&c.forme==='Indépendant')addDossier(c,'ipp');
   if(m1===6&&['SRL','SA','Groupe'].includes(c.forme))addDossier(c,'isoc');
   if(m1===0&&['SRL','SA','Groupe'].includes(c.forme))addDossier(c,'clo');
   if(c.svc&&c.svc.paie)addDossier(c,'paie');
   if(c.svc&&c.svc.cons&&m1%3===0)addDossier(c,'cons');
  }

 }
 if(S.day%5===0){S.cands=[];for(let i=0;i<5;i++)S.cands.push(candidate())}
 for(const d of S.dossiers){
  const c=client(d.cid);
  if(S.day>d.dl){
   if(!d.late){d.late=true;S.rep=clamp(S.rep-1,0,100);if(c)c.sat=clamp(c.sat-8,0,100);
    if(d.type==='tva'){S.cash-=50;log(`Déclaration TVA de ${dname(d)} en retard : amende de 50 €.`)}
    else log(`« ${d.lab} » de ${dname(d)} est en retard.`)}
   else if(c)c.sat=clamp(c.sat-2,0,100);
  }
 }
 S.prospects=S.prospects.filter(p=>p.exp>=S.day);
 if(S.prospects.length<3&&Math.random()<.15+S.rep/250){S.prospects.push(prospect());log('Un nouveau prospect demande une offre.')}
 if(S.cash<0)toastWarn();

 if(!S.noSum)showSummary(before);
}

}

 h+=`<div class="sec"><h3>À traiter</h3><div class="card"><div class="rowx"><span>Dossiers non attribués</span><b class="mono">${un}</b></div><div class="rowx"><span>Dossiers en retard</span><b class="mono ${late?'p-red':''}">${late}</b></div><div class="rowx"><span>Mes dossiers</span><b class="mono">${mine.length}</b></div>
 <button data-act="tab" data-v="dossiers">Ouvrir les dossiers</button></div></div>`;
 h+=`<div class="sec"><h3>Demandes de prospects</h3>${S.prospects.length?S.prospects.map(p=>p.mis?`<div class="card"><div class="rowx"><span class="name">${esc(MIS[p.mi].t)}</span><span class="pill p-amber">Mission</span></div>
 <div class="sub">${esc(p.name)} · ${eur(p.fee)} HTVA à la livraison · environ ${MIS[p.mi].h} h · difficulté ${'●'.repeat(MIS[p.mi].diff)}${'○'.repeat(3-MIS[p.mi].diff)} · répond avant le ${fshort(p.exp)}</div>
 <div class="btns"><button class="pri" data-act="accept" data-v="${p.id}">Accepter</button><button data-act="refuse" data-v="${p.id}">Refuser</button></div></div>`:`<div class="card"><div class="rowx"><span class="name">${esc(p.c.name)}</span><span class="pill p-mut">${p.c.forme}${p.c.off?' · '+esc(S.offs[p.c.off].n):''}</span></div>
 <div class="sub">${esc(p.c.town)} · ${p.c.tva?'assujetti TVA':'non assujetti'} · répond avant le ${fshort(p.exp)}</div>
 <div class="rowx"><span class="sub">Prix du marché ${eur(p.c.mk)}</span><span class="mono">Votre offre ${eur(p.c.fee)} HTVA / mois</span></div>
 <div class="price">${[[.9,'−10 %'],[1,'Marché'],[1.1,'+10 %'],[1.25,'+25 %']].map(([f,l])=>`<button class="${Math.abs(p.c.fee/p.c.mk-f)<.02?'sel':''}" data-act="pprice" data-v="${p.id}:${f}">${l}</button>`).join('')}</div>
 <div class="btns"><button class="pri" data-act="accept" data-v="${p.id}">Accepter</button><button data-act="refuse" data-v="${p.id}">Refuser</button></div></div>`).join(''):'<div class="empty">Aucune demande pour le moment. Une bonne réputation en attire davantage.</div>'}</div>`;
 h+=`<div class="sec"><h3>Journal</h3><div class="card log">${S.log.slice(0,12).map(l=>`<div><span class="d">${fshort(l.d)}</span>${esc(l.t)}</div>`).join('')}</div></div>`;
 return h;
}
function monthDays(off){
 const cur=dateOf(S.day),tgt=new Date(cur.getFullYear(),cur.getMonth()+off,1),key=d=>d.getFullYear()*12+d.getMonth(),tk=key(tgt);
 let n=S.day;while(key(dateOf(n))>tk&&n>0)n--;while(key(dateOf(n))<tk)n++;while(n>0&&key(dateOf(n-1))===tk)n--;
 const out=[];if(key(dateOf(n))===tk)while(key(dateOf(n))===tk){out.push(n);n++}
 return {days:out,label:tgt.toLocaleDateString('fr-BE',{month:'long',year:'numeric'})};
}
function vCal(){
 const {days,label}=monthDays(calOff);
 const by={};for(const d of S.dossiers){(by[d.dl]=by[d.dl]||[]).push(d)}
 const lead=(dateOf(days[0]).getDay()+6)%7;
 let h=`<div class="card"><div class="rowx"><button data-act="calnav" data-v="-1" aria-label="Mois précédent">‹</button><span class="name" style="text-transform:capitalize">${label}</span><button data-act="calnav" data-v="1" aria-label="Mois suivant">›</button></div>
 <div class="cal">${['Lun','Mar','Mer','Jeu','Ven'].map(x=>`<span class="hd">${x}</span>`).join('')}${'<button class="out" disabled></button>'.repeat(Math.min(lead,4))}
 ${days.map(n=>{const ds=by[n]||[];return `<button class="${n===S.day?'today':''} ${calSel===n?'selday':''}" data-act="calday" data-v="${n}">${dateOf(n).getDate()}<span class="dots">${ds.slice(0,6).map(d=>`<i class="${d.late?'l':n-S.day<=3?'s':''}"></i>`).join('')}</span></button>`}).join('')}</div>
 <div class="sub">Chaque point est un dossier à rendre ce jour-là. Touchez un jour pour voir ses dossiers.</div></div>`;
 const late=S.dossiers.filter(d=>d.dl<days[0]&&calOff===0);
 const list=calSel!==null?(by[calSel]||[]):[];
 if(calSel!==null)h+=`<h3>Échéances du ${fshort(calSel)}</h3>${list.length?list.map(dossierCard).join(''):'<div class="empty">Aucun dossier à rendre ce jour-là.</div>'}`;
 else if(late.length)h+=`<h3>Échéances déjà dépassées</h3>${late.map(dossierCard).join('')}`;
 return h;
}
function vDossiers(){
 const ds=[...S.dossiers].sort((a,b)=>(a.who===null?0:1)-(b.who===null?0:1)||a.dl-b.dl);
 return `<div class="sec"><h2>Dossiers (${ds.length})</h2><div class="seg"><button class="${dview==='liste'?'sel':''}" data-act="dview" data-v="liste">Liste</button><button class="${dview==='cal'?'sel':''}" data-act="dview" data-v="cal">Calendrier</button></div>
 ${dview==='cal'?vCal():`${S.dossiers.some(d=>d.who===null)&&S.staff.length?`<button class="pri" data-act="auto">Répartir automatiquement (${S.dossiers.filter(d=>d.who===null).length} libres)</button>`:''}<div class="sub">Répartissez chaque dossier. Attribuez-vous les encodages délicats pour les faire à la main.</div>${ds.length?ds.map(dossierCard).join(''):'<div class="empty">Tous les dossiers sont à jour.</div>'}`}</div>`;
}
function vClients(){
 return `<div class="sec"><h2>Clients (${S.clients.length} / ${maxC()})</h2>${S.clients.map(c=>{const n=S.dossiers.filter(d=>d.cid===c.id).length;
 return `<div class="card"><div class="rowx"><span class="name">${esc(c.name)}</span>${satPill(c.sat)}</div><div class="sub">${c.forme} · ${esc(c.town)}${S.offs.length>1?` · bureau : ${esc(S.offs[c.off||0].n)}`:''} · ${c.tva?'TVA trimestrielle':'non assujetti'} · client depuis le ${fshort(c.since)}</div>
 <div class="rowx"><span class="mono">${eur(c.fee)} HTVA / mois</span><span class="sub">${n} dossier${n>1?'s':''} ouvert${n>1?'s':''}</span></div>
 <div class="rowx"><span class="sub">Marché ${eur(c.mk||c.fee)} · ${c.fee>(c.mk||c.fee)*1.03?'au-dessus':c.fee<(c.mk||c.fee)*.97?'en dessous':'au prix'}</span><div class="btns"><button data-act="cprice" data-v="${c.id}:0.95">−5 %</button><button data-act="cprice" data-v="${c.id}:1.05">+5 %</button></div></div>${svcRow(c)}</div>`}).join('')||'<div class="empty">Aucun client.</div>'}</div>`;
}
function vEquipe(){
 const full=S.staff.length>=maxS();
 let h=`<div class="sec"><h2>Équipe (${S.staff.length} / ${maxS()})</h2>${S.staff.map(s=>{const load=S.dossiers.filter(d=>d.who===s.id).reduce((a,d)=>a+d.h-d.done,0);const nxt=s.lvl===1?700:s.lvl===2?1800:0;
 return `<div class="card"><div class="rowx"><span class="name">${esc(s.name)}</span><span class="pill p-mut">${ROLE[s.lvl].t}</span></div>
 ${S.offs.length>1?`<div class="btns">${S.offs.map((o,i)=>`<button class="${(s.off||0)===i?'pri':''}" data-act="soff" data-v="${s.id}:${i}">${esc(o.n)}</button>`).join('')}</div>`:''}
 <div class="wk">${s.wk.map((w,i)=>`<button class="${w}" data-act="shift" data-v="${s.id}:${i}" aria-label="${DAYS[i]} : ${SHIFT[w].l}">${DAYS[i]}<small>${SHIFT[w].l}</small></button>`).join('')}</div>
 <div class="sub">Congés restants cette année : ${s.cg.toString().replace('.',',')} j · touchez un jour pour le changer</div>
 <div class="sub">Salaire ${eur(s.sal)} brut · charge en cours ${load.toFixed(1).replace('.',',')} h · ${(s.wk.reduce((a,w)=>a+SHIFT[w].h,0)*SPEED[s.lvl]).toFixed(1).replace('.',',')} h utiles / semaine</div>
 ${nxt?`<div class="sub">Expérience ${Math.round(s.xp)} / ${nxt} h</div><div class="bar"><i style="width:${Math.min(100,s.xp/nxt*100)}%"></i></div>`:''}
 <div class="btns">${s.lvl<3?`<button data-act="train" data-v="${s.id}" ${S.cash<(s.lvl===1?600:1200)||(s.trd&&S.day-s.trd<20)?'disabled':''}>Former (${eur(s.lvl===1?600:1200)}, +200 h)</button>`:''}<button class="dan" data-act="fire" data-v="${s.id}">Licencier</button></div>
 ${s.trd&&S.day-s.trd<20?`<div class="sub">Prochaine formation possible le ${fshort(s.trd+20)}.</div>`:''}</div>`}).join('')||'<div class="empty">Vous travaillez seul pour l\'instant.</div>'}</div>`;
 h+=`<div class="sec"><h3>Candidats disponibles</h3><div class="sub">Nouvelle liste chaque lundi. Charges patronales d'environ 27 % en plus du brut.</div>${S.cands.map(c=>`<div class="card"><div class="rowx"><span class="name">${esc(c.name)}</span><span class="pill p-mut">Niveau ${c.lvl}</span></div>
 <div class="sub">${ROLE[c.lvl].t} · ${eur(c.sal)} brut / mois · coût total ${eur(c.sal*1.27)}</div><button class="pri" data-act="hire" data-v="${c.id}" ${full?'disabled':''}>Engager</button></div>`).join('')}
 ${full?'<div class="sub p-amber">Équipe complète pour ce palier.</div>':''}</div>`;
 return h;
}
function chart(title,vals,labels,fmt){
 if(vals.length<2)return `<div class="card"><span class="name">${title}</span><div class="empty">Disponible après deux mois clôturés.</div></div>`;
 const W=320,H=120,pl=46,pr=10,pt=10,pb=20,mn=Math.min(0,...vals),mx=Math.max(...vals),rg=mx-mn||1;
 const x=i=>pl+i*(W-pl-pr)/(vals.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/rg);
 const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 const ticks=[mn,(mn+mx)/2,mx];
 return `<div class="card chart"><div class="rowx"><span class="name">${title}</span><b class="mono">${fmt(vals[vals.length-1])}</b></div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${ticks.map(t=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl-4}" y="${y(t)+3}" text-anchor="end">${fmt(t,1)}</text>`).join('')}
 ${mn<0?`<line class="zr" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`:''}
 <polygon class="ar" points="${x(0)},${y(mn)} ${pts} ${x(vals.length-1)},${y(mn)}"/><polyline class="ln" points="${pts}"/>
 <circle class="dt" cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3.5"/>
 <text class="ax" x="${pl}" y="${H-4}">${labels[0]}</text><text class="ax" x="${W-pr}" y="${H-4}" text-anchor="end">${labels[labels.length-1]}</text></svg></div>`;
}
function vCharts(){
 const ms=S.months.slice(0,12).reverse(),sl=m=>m.m.slice(0,3)+' '+m.m.slice(-2),lab=ms.map(sl);
 const k=(v,short)=>short&&Math.abs(v)>=1000?(Math.round(v/100)/10).toString().replace('.',',')+' k':eur(v);
 const withCash=ms.filter(m=>m.cash!==undefined),cl=ms.filter(m=>m.cli!==undefined);
 return `<div class="sec"><h3>Évolution (12 derniers mois)</h3>
 ${chart('Trésorerie en fin de mois',withCash.map(m=>m.cash),withCash.map(sl),k)}
 ${chart('Honoraires du mois (HTVA)',ms.map(m=>m.fees),lab,k)}
 ${chart('Résultat du mois',ms.map(m=>m.net),lab,k)}
 ${chart('Nombre de clients',cl.map(m=>m.cli),cl.map(sl),v=>String(Math.round(v)))}</div>`;
}
function vFin(){
 const fees=S.clients.reduce((a,c)=>a+feeOf(c),0),sal=S.staff.reduce((a,s)=>a+s.sal,0),onss=Math.round(sal*.27),loyer=PAL[S.pal].loyer+ANT.loyer*(S.offs.length-1),soft=45*(S.staff.length+1),st=150*S.pal*S.pal,net=fees+S.mMis-sal-onss-loyer-soft-st-S.me.sal;
 const row=(l,v,neg)=>`<tr><td>${l}</td><td class="n ${neg&&v?'p-red':''}">${neg&&v?'− ':''}${eur(v)}</td></tr>`;
 let h=`<div class="sec"><h2>Prévision fin de mois</h2><div class="card scroll"><table>
 ${row('Honoraires clients (HTVA)',fees)}${S.mMis?row('Missions livrées ce mois (HTVA)',S.mMis):''}${row('Salaires bruts',sal,1)}${row('Charges patronales (27 %)',onss,1)}${row('Loyer',loyer,1)}${row('Logiciel comptable',soft,1)}${row('Frais de structure',st,1)}${row('Rémunération du dirigeant',S.me.sal,1)}
 <tr><th>Résultat estimé</th><th class="n ${net<0?'p-red':'p-ok'}">${eur(net)}</th></tr></table></div></div>`;
 const solde=S.tvaDue-S.tvaDed,isoc=S.qNet>0?.2*Math.min(S.qNet,25000)+.25*Math.max(0,S.qNet-25000):0;
 h+=`<div class="sec"><h3>Trimestre en cours</h3><div class="card scroll"><table>
 <tr><td>TVA facturée (due)</td><td class="n">${eur(S.tvaDue)}</td></tr><tr><td>TVA déductible</td><td class="n">${eur(S.tvaDed)}</td></tr>
 <tr><td>Solde TVA ${solde>=0?'à verser':'à récupérer'}</td><td class="n">${eur(Math.abs(solde))}</td></tr>
 <tr><td>Résultat des mois clôturés</td><td class="n ${S.qNet<0?'p-red':''}">${eur(S.qNet)}</td></tr>
 <tr><td>Impôt des sociétés estimé (20 % puis 25 %)</td><td class="n">${eur(isoc)}</td></tr></table></div>
 <div class="sub">À chaque fin de trimestre : impôt prélevé et déclaration TVA du bureau à remplir.</div></div>`;
 if(S.quarters.length)h+=`<div class="sec"><h3>Clôtures trimestrielles</h3><div class="card scroll"><table><tr><th>Trimestre</th><th class="n">Résultat</th><th class="n">Impôt</th></tr>${S.quarters.map(q=>`<tr><td>${q.q}</td><td class="n ${q.res<0?'p-red':''}">${eur(q.res)}</td><td class="n">${eur(q.isoc)}</td></tr>`).join('')}</table></div></div>`;
 h+=vCharts();
 h+=`<div class="sec"><h3>Historique</h3>${S.months.length?`<div class="card scroll"><table><tr><th>Mois</th><th class="n">Honoraires</th><th class="n">Charges</th><th class="n">Résultat</th></tr>${S.months.map(m=>`<tr><td style="text-transform:capitalize">${m.m}</td><td class="n">${eur(m.fees)}</td><td class="n">${eur(m.fees-m.net)}</td><td class="n ${m.net<0?'p-red':''}">${eur(m.net)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Le premier mois n\'est pas encore clôturé.</div>'}</div>`;
 h+=`<div class="sec"><h3>Partie</h3><div class="card"><div class="sub">Sauvegarde automatique sur cet appareil.</div>${S.noSum?'<button data-act="sumon">Réafficher le résumé de la journée</button>':''}<button class="dan" data-act="reset">Recommencer une partie</button></div></div>`;
 return h;
}
function vMoi(){
 const me=S.me,next=1500*(me.flvl+1);
 let h=`<div class="sec"><h2>Mon profil de directeur</h2><div class="card"><div class="rowx"><span>Compte personnel</span><b class="mono">${eur(me.perso)}</b></div>
 <div class="rowx"><span>Portefeuille d'actions</span><b class="mono">${eur(me.inv)}</b></div><div class="rowx"><span>Prêt au bureau (compte courant)</span><b class="mono">${eur(me.loan)}</b></div>
 <div class="rowx"><span>Heures par jour</span><b class="mono">${(8+.5*me.flvl+.25*S.eq.ecran).toString().replace('.',',')} h</b></div></div></div>`;

 <div class="price">${DSAL.slice(1).map(v=>`<button class="${me.sal===v?'sel':''}" data-act="dsal" data-v="${v}">${(v/1000).toString().replace('.',',')} k€</button>`).join('')}</div>
 <button class="${me.sal===0?'pri':''}" data-act="dsal" data-v="0">Pas de rémunération</button></div></div>`;
 h+=`<div class="sec"><h3>Placement</h3><div class="card"><div class="sub">Rapporte entre 2 et 7 % par an, versé chaque mois.</div>
 <div class="btns"><button data-act="invest" data-v="1000" ${me.perso<1000?'disabled':''}>Placer 1 000 €</button><button data-act="invest" data-v="5000" ${me.perso<5000?'disabled':''}>Placer 5 000 €</button><button data-act="invest" data-v="0" ${me.inv?'':'disabled'}>Tout revendre</button></div></div></div>`;
 h+=`<div class="sec"><h3>Le bureau</h3><div class="card"><div class="btns"><button data-act="lend" ${me.perso<5000?'disabled':''}>Prêter 5 000 €</button><button data-act="repay" ${me.loan&&S.cash>=Math.min(me.loan,5000)?'':'disabled'}>Me faire rembourser</button><button data-act="apport" ${me.perso<5000?'disabled':''}>Apport de 5 000 €</button></div>

 h+=`<div class="sec"><h3>Ma formation</h3><div class="card"><div class="rowx"><span>Niveau ${me.flvl} / 5</span><span class="sub">+0,5 h par jour à chaque niveau</span></div>
 ${me.flvl<5?`<button class="pri" data-act="dtrain" ${me.perso<next?'disabled':''}>Suivre le niveau ${me.flvl+1} (${eur(next)})</button>`:'<div class="sub">Formation complète.</div>'}</div></div>`;
 h+=`<div class="sec"><h3>Trophées (${S.tro.length} / ${TRO.length})</h3><div class="card">${TRO.map(([id,n,d,,r])=>`<div class="rowx"><span><b>${n}</b><br><span class="sub">${d} · prime ${eur(r)}</span></span>${S.tro.includes(id)?'<span class="pill p-ok">Obtenu</span>':'<span class="pill p-mut">À faire</span>'}</div>`).join('')}</div></div>`;
 h+=`<div class="sec"><h3>Achats personnels</h3>${ITEMS.map((it,i)=>`<div class="card"><div class="rowx"><span class="name">${it.n}</span>${me.owned.includes(i)?'<span class="pill p-ok">Acheté</span>':`<button data-act="buy" data-v="${i}" ${me.perso<it.p?'disabled':''}>${eur(it.p)}</button>`}</div></div>`).join('')}</div>`;
 return h;

function render(){
 checkTro();renderTop();
 const un=S.dossiers.filter(d=>d.who===null||d.late).length;
 const tabs=[['bureau','Bureau',S.prospects.length],['dossiers','Dossiers',un],['clients','Clients',0],['equipe','Équipe',0],['fin','Finances',0],['moi','Moi',0]];
 document.getElementById('nav').innerHTML=tabs.map(([k,l,b])=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}">${l}${b?`<span class="bdg">${b}</span>`:''}</button>`).join('');
 document.getElementById('app').innerHTML={bureau:vBureau,dossiers:vDossiers,clients:vClients,equipe:vEquipe,fin:vFin,moi:vMoi}[tab]();
}
if(!load()){newGame();save()}
render();
